
services:
  - type: web
    name: hermes-agent
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: API_SERVER_ENABLED
        value: "true"
      - key: API_SERVER_HOST
        value: "0.0.0.0"
      - key: API_SERVER_PORT
        value: "8642"
      - key: API_SERVER_KEY
        generateValue: true
    disk:
      name: hermes-data
      mountPath: /opt/data
      sizeGB: 5
