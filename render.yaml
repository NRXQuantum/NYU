
services:
  - type: web
    name: hermes-agent
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile

    envVars:
      - key: HERMES_DASHBOARD
        value: "1"

      - key: HERMES_DASHBOARD_HOST
        value: "0.0.0.0"

      - key: HERMES_DASHBOARD_PORT
        value: "10000"

      - key: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
        value: "admin"

      - key: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
        generateValue: true

      - key: HERMES_DASHBOARD_BASIC_AUTH_SECRET
        generateValue: true

      - key: API_SERVER_ENABLED
        value: "true"

      - key: API_SERVER_HOST
        value: "0.0.0.0"

      - key: API_SERVER_PORT
        value: "8642"

      - key: API_SERVER_KEY
        generateValue: true

    disk:
      name: hermes-data
      mountPath: /opt/data
      sizeGB: 5
